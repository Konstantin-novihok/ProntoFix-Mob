name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The failed build selected Temurin 11 even though openjdk-17 was installed.
      # setup-java explicitly sets JAVA_HOME and prepends Java 17 to PATH.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython==0.29.33 setuptools

      - name: Verify build toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          python --version
          buildozer --version

      - name: Clean old buildozer cache
        run: rm -rf .buildozer

      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeMaster-apk
          path: bin/*.apk
          if-no-files-found: error
